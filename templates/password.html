{% extends "base.html" %}

{% load static %}

{% block content %}
<br>
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-lg">
        <div class="card-header text-center bg-info text-white">
          <h3 class="mb-0">Cambiar Contraseña</h3>
        </div>
        <div class="card-body">
          <form action="{% url 'password' %}" method="POST">
            {% csrf_token %}

            <div class="mb-3">
              <label for="old_password" class="form-label">Contraseña actual</label>
              <input type="password" class="form-control" name="old_password" id="old_password" required>
            </div>

            <div class="mb-3">
              <label for="new_password1" class="form-label">Nueva contraseña</label>
              <input type="password" class="form-control" name="new_password1" id="new_password1" required>
            </div>

            <div class="mb-3">
              <label for="new_password2" class="form-label">Repita contraseña</label>
              <input type="password" class="form-control" name="new_password2" id="new_password2" required>
            </div>

            <div class="d-flex justify-content-between mt-4">
              <a href="{% url 'perfil' %}" class="btn btn-outline-secondary">← Volver atrás</a>
              <input type="submit" class="btn btn-primary" value="Cambiar Contraseña" {% if password_changed %} disabled {% endif %}>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<br><br>

{% endblock %}
