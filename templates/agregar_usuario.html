{% extends "base.html" %}

{% load static %}

{% block content %}<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-lg">
        <div class="card-header text-center" style="background-color: #d1ecf1;">
          <h4 class="mb-0 text-dark">Crear Nuevo Usuario</h4>
        </div>
        <div class="card-body">
          <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
              <label for="username" class="form-label fw-bold">Nombre de usuario</label>
              <input type="text" name="username" id="username" class="form-control" required>
            </div>

            <div class="row mb-3">
              <div class="col">
                <label for="first_name" class="form-label fw-bold">Nombre</label>
                <input type="text" name="first_name" id="first_name" class="form-control" required>
              </div>
              <div class="col">
                <label for="last_name" class="form-label fw-bold">Apellido</label>
                <input type="text" name="last_name" id="last_name" class="form-control" required>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col">
                <label for="email" class="form-label fw-bold">Correo electrónico</label>
                <input type="email" name="email" id="email" class="form-control" required>
              </div>
              <div class="col">
                <label for="group" class="form-label fw-bold">Grupo</label>
                <select name="group" id="group" class="form-select" required>
                  <option disabled selected>Seleccione un grupo</option>
                  {% for group, singular_groups in groups %}
                    <option value="{{ group.id }}">{{ singular_groups }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <div class="d-flex justify-content-between mt-4">
              <button type="submit" class="btn btn-success">
                <i class="bi bi-person-plus-fill"></i> Crear Usuario
              </button>
              <a href="{% url 'productos' %}" class="btn btn-outline-secondary">
                <i class="bi bi-x-circle"></i> Cancelar
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<br><br>

{% endblock %}
