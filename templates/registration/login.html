{% extends "base.html" %}

{% load static %}

{% block content %}
<body>
  

<link rel="stylesheet" href="{% static '/styles/inicio_sesion_2.css'%}">
<div class="limiter">
    <div class="container-login100">
      <div class="wrap-login100">
        <form class="login100-form validate-form" method="POST" action="{% url 'ini' %}">
          {% csrf_token %}
          <span class="login100-form-title p-b-43 fs-1 fw-bold text-center text-acento">
  Inicia sesión para continuar
</span>

<br>

          <div class="wrap-input100 validate-input" data-validate="Se requiere un nombre de usuario válido">
            <input class="input100" type="text" name="username" placeholder="Usuario">
            <span class="focus-input100"></span>
            <span class="label-input100"></span>
          </div>

          <div class="wrap-input100 validate-input" data-validate="La contraseña es obligatoria">
            <input class="input100" type="password" name="password" placeholder="Contraseña">
            <span class="focus-input100"></span>
            <span class="label-input100"></span>
          </div>

          <div class="flex-sb-m w-full p-t-3 p-b-32">
            <div class="contact100-form-checkbox">
              <input class="input-checkbox100" id="ckb1" type="checkbox" name="remember-me">
              <label class="label-checkbox100" for="ckb1">
                Recuérdame
              </label>
            </div>

            <div>
              <a href="{% url 'password_reset' %}" class="txt1">
                ¿Olvidaste tu contraseña?
              </a>
            </div>
          </div>

          <div class="container-login100-form-btn">
            <button class="login100-form-btn" type="submit">
              Iniciar sesión
            </button>
          </div>

          <div class="text-center p-t-46 p-b-20">
            <span class="txt2">
              o regístrate usando
            </span>
          </div>

          <div class="login100-form-social flex-c-m">
            <a href="#" class="login100-form-social-item flex-c-m bg1 m-r-5">
              <i class="fa fa-facebook-f" aria-hidden="true"></i>
            </a>

            <a href="#" class="login100-form-social-item flex-c-m bg2 m-r-5">
              <i class="fa fa-twitter" aria-hidden="true"></i>
            </a>
          </div>

          <div class="text-center p-t-20">
            <a href="{% url 'register' %}">
              <button type="button" class="login100-form-btn" style="background-color:#00bfa6;">
                Regístrate
              </button>
            </a>
          </div>
        </form>

        <div class="login100-more"></div>



        </div>
      </div>
    </div>
  </div><br>
  </body>
  
  <script type="text/javascript" src="{% static 'js/inicio_sesion.js' %}"></script>
{% endblock %}
