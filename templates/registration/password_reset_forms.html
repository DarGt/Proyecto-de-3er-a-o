{% extends "base.html" %}
{% load static %}

{% block content %}
<form method="post" class="mt-4">
    {% csrf_token %}
    <div class="mb-3">
        <label for="id_email" class="form-label">Correo:</label>
        {{ form.email }}
    </div>
    <button type="submit" class="btn btn-primary">Enviar</button>
</form>

{% endblock %}
