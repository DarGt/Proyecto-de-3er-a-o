<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Perfil de Usuario</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #4CAF50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>

<body>
    <h1>Perfil de {{ usuario.username }}</h1>
    <table>
        <tr>
            <th>Nombre</th>
            <td>{{ usuario.first_name }} {{ usuario.last_name }}</td>
        </tr>
        <tr>
            <th>Correo Electrónico</th>
            <td>{{ usuario.email }}</td>
        </tr>
        <tr>
            <th>Fecha de Registro</th>
            <td>{{ usuario.date_joined }}</td>
        </tr>
    </table>
</body>

</html>
